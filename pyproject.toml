[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-spark-data-collection-pipeline"
version = "1.0.0"
description = "Airflow와 Spark 기반 Books to Scrape 로컬 데이터 파이프라인"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["airflow/logs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
